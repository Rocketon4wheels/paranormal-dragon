<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Beam glow outer -->
  <ellipse cx="64" cy="82" rx="52" ry="12" fill="#7c3aed" opacity="0.15"/>
  <!-- Beam -->
  <polygon points="36,88 92,88 80,118 48,118" fill="#a855f7" opacity="0.3"/>
  <polygon points="44,88 84,88 76,112 52,112" fill="#c084fc" opacity="0.2"/>
  <!-- Beam center bright -->
  <polygon points="54,88 74,88 70,108 58,108" fill="#e9d5ff" opacity="0.15"/>
  <!-- Shadow under craft -->
  <ellipse cx="64" cy="90" rx="46" ry="8" fill="#3b0764" opacity="0.6"/>
  <!-- Undercarriage rim -->
  <ellipse cx="64" cy="86" rx="44" ry="9" fill="#4c1d95"/>
  <ellipse cx="64" cy="84" rx="44" ry="9" fill="#5b21b6"/>
  <!-- Body plate -->
  <ellipse cx="64" cy="80" rx="44" ry="10" fill="#6d28d9"/>
  <!-- Body edge highlight -->
  <ellipse cx="64" cy="78" rx="43" ry="8" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <!-- Main dome base -->
  <ellipse cx="64" cy="72" rx="34" ry="14" fill="#7c3aed"/>
  <!-- Dome -->
  <ellipse cx="64" cy="62" rx="26" ry="20" fill="#8b5cf6"/>
  <ellipse cx="64" cy="58" rx="23" ry="18" fill="#9333ea"/>
  <!-- Dome inner glow -->
  <ellipse cx="64" cy="54" rx="18" ry="14" fill="#a855f7"/>
  <!-- Dome top highlight -->
  <ellipse cx="57" cy="46" rx="10" ry="7" fill="#c084fc" opacity="0.6"/>
  <ellipse cx="55" cy="44" rx="5" ry="3.5" fill="#e9d5ff" opacity="0.5"/>
  <!-- Star reflection in dome -->
  <circle cx="70" cy="48" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="66" cy="52" r="1" fill="#fff" opacity="0.3"/>
  <!-- Running lights - large and glowing -->
  <circle cx="22" cy="82" r="5" fill="#fbbf24"/>
  <circle cx="22" cy="82" r="8" fill="#fbbf24" opacity="0.2"/>
  <circle cx="38" cy="88" r="5" fill="#22c55e"/>
  <circle cx="38" cy="88" r="8" fill="#22c55e" opacity="0.2"/>
  <circle cx="64" cy="90" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="90" r="8" fill="#fbbf24" opacity="0.2"/>
  <circle cx="90" cy="88" r="5" fill="#22c55e"/>
  <circle cx="90" cy="88" r="8" fill="#22c55e" opacity="0.2"/>
  <circle cx="106" cy="82" r="5" fill="#fbbf24"/>
  <circle cx="106" cy="82" r="8" fill="#fbbf24" opacity="0.2"/>
  <!-- Antenna -->
  <line x1="64" y1="38" x2="64" y2="28" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="26" r="3.5" fill="#e9d5ff"/>
  <circle cx="64" cy="26" r="6" fill="#c084fc" opacity="0.25"/>
</svg>
